
{% extends "Base.html" %}

{% block title %}Crear cuenta | Mi Tienda{% endblock %}

{% block content %}
<section class="seccion">
    <div class="contenedor">

        <div class="encabezado-seccion">
            <h1>Crear una cuenta</h1>
            <p>Completa tus datos para registrarte en nuestra tienda.</p>
        </div>

        <div class="formulario-login">
            <form action="#" method="POST">

                <div class="campo-formulario">
                    <label for="nombre">Nombre completo</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Escribe tu nombre completo"
                        autocomplete="name"
                        minlength="3"
                        required>
                </div>

                <div class="campo-formulario">
                    <label for="correo">Correo electrónico</label>
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="ejemplo@correo.com"
                        autocomplete="email"
                        required>
                </div>

                <div class="campo-formulario">
                    <label for="contrasena">Contraseña</label>
                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        placeholder="Crea una contraseña"
                        autocomplete="new-password"
                        minlength="8"
                        required>
                </div>

                <div class="campo-formulario">
                    <label for="confirmar_contrasena">
                        Confirmar contraseña
                    </label>

                    <input
                        type="password"
                        id="confirmar_contrasena"
                        name="confirmar_contrasena"
                        placeholder="Escribe nuevamente la contraseña"
                        autocomplete="new-password"
                        minlength="8"
                        required>
                </div>

                <button type="submit" class="boton-confirmar">
                    Crear cuenta
                </button>

            </form>

            <p>
                ¿Ya tienes una cuenta?
                <a href="{{ url_for('main.login') }}">Iniciar sesión</a>
            </p>

            <p>
                <a href="{{ url_for('main.index') }}">Volver a la tienda</a>
            </p>
        </div>

    </div>
</section>
{% endblock %}
